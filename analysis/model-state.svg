nt-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">own gateway software;</text><text x="121.71428571428571" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">final report out</text><text x="121.71428571428571" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">0.4%</text><line x1="301.1428571428571" y1="204" x2="301.1428571428571" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="219.42857142857142" y="300" width="163.42857142857142" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="301.1428571428571" y="326" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">FAA ground stop</text><text x="301.1428571428571" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">13 Nov</text><text x="301.1428571428571" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">a new router flooded</text><text x="301.1428571428571" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">the network, says FAA</text><text x="301.1428571428571" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">0.8%</text><line x1="480.57142857142856" y1="204" x2="480.57142857142856" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="398.85714285714283" y="300" width="163.42857142857142" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="480.57142857142856" y="326" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Chase</text><text x="480.57142857142856" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">16 Nov</text><text x="480.57142857142856" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">software bug, says Chase;</text><text x="480.57142857142856" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">vendor attack &quot;separate&quot;</text><text x="480.57142857142856" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">1.1%</text><line x1="659.9999999999999" y1="204" x2="659.9999999999999" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="578.2857142857142" y="300" width="163.42857142857142" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="659.9999999999999" y="326" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">United Airlines</text><text x="659.9999999999999" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">16 Nov</text><text x="659.9999999999999" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">weight system; no cause;</text><text x="659.9999999999999" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">&quot;no indication&quot;</text><text x="659.9999999999999" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">0.8%</text><line x1="839.4285714285713" y1="204" x2="839.4285714285713" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="757.7142857142857" y="300" width="163.42857142857142" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="839.4285714285713" y="326" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">NSA Net</text><text x="839.4285714285713" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">17 Nov</text><text x="839.4285714285713" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">patching, say the NSA</text><text x="839.4285714285713" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">and the director</text><text x="839.4285714285713" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">3.7%</text><line x1="1018.8571428