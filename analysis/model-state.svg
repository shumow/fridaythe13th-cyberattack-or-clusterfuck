<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" font-family="Inter, Helvetica Neue, Arial, sans-serif"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5f5e5a"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#e8622c"/></marker></defs><rect width="1320" height="1030" fill="#fff"/><text x="40" y="44" font-size="25" font-weight="700" fill="#1a1a1a" text-anchor="start">Five outages, no wire between them, and one question above them</text><text x="40" y="72" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="start">What the frozen model (version 1) holds as of 2026-11-20 20:02 UTC. Percentages on the outages are the middle observer&#x27;s chance that it was an attack.</text><rect x="40" y="100" width="1240" height="104" rx="10" fill="#fff" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5"/><text x="660.0" y="126" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">One campaign behind several of them?</text><text x="660.0" y="145" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">the only week-level question version 1 asks</text><text x="660.0" y="164" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">calm 0.01%   ·   middle 0.1%   ·   suspicious 1.4%</text><line x1="156" y1="204" x2="156" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="40" y="300" width="232" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="156.0" y="326" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Microsoft 365</text><text x="156.0" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">12 to 13 Nov</text><text x="156.0" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">own gateway software;</text><text x="156.0" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">preliminary report published</text><text x="156.0" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">0.6%</text><line x1="408" y1="204" x2="408" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="292" y="300" width="232" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="408.0" y="326" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">FAA ground stop</text><text x="408.0" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">13 Nov</text><text x="408.0" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">a new router flooded the</text><text x="408.0" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">network; FAA&#x27;s own account</text><text x="408.0" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">0.9%</text><line x1="660" y1="204" x2="660" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="544" y="300" width="232" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="660.0" y="326" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Chase</text><text x="660.0" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">16 Nov</text><text x="660.0" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">a software bug, says Chase;</text><text x="660.0" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">a vendor attack, it says, is separate</text><text x="660.0" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">1.9%</text><line x1="912" y1="204" x2="912" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="796" y="300" width="232" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="912.0" y="326" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">United Airlines</text><text x="912.0" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">16 Nov</text><text x="912.0" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">cause not given;</text><text x="912.0" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">&quot;no indication&quot; of an attack</text><text x="912.0" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">1.7%</text><line x1="1164" y1="204" x2="1164" y2="296" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="1048" y="300" width="232" height="132" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="1164.0" y="326" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">NSA Net</text><text x="1164.0" y="345" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">17 Nov</text><text x="1164.0" y="364" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">patching, say the NSA and</text><text x="1164.0" y="383" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">the intelligence director</text><text x="1164.0" y="418" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">3.9%</text><text x="282" y="244" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle">no shared vendor,</text><text x="282" y="260" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle">change or wire</text><path d="M276 270 l12 12 m0 -12 l-12 12" stroke="#1a1a1a" stroke-width="2" fill="none"/><text x="40" y="650" font-size="14" font-weight="700" fill="#5f5e5a" text-anchor="start">Logged around them as context. Version 1 does not score these, apart from the ransomware claim.</text><rect x="40" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="123.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Two federal systems</text><text x="123.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">hit by security</text><text x="123.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">incidents in October,</text><text x="123.0" y="603" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">before the window</text><rect x="219" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="302.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Amtrak</text><text x="302.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">booking down during</text><text x="302.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">the ground stop:</text><text x="302.0" y="603" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">a knock-on</text><line x1="378" y1="432" x2="302" y2="516" stroke="#5f5e5a" stroke-width="2" marker-end="url(#a)"/><rect x="398" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="481.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Weather Service</text><text x="481.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">reported down;</text><text x="481.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">the agency denied it</text><line x1="481" y1="520" x2="418" y2="436" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="577" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="660.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Six other banks</text><text x="660.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">named from user</text><text x="660.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">reports; most</text><text x="660.0" y="603" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">denied any fault</text><line x1="660" y1="520" x2="660" y2="436" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#a)"/><rect x="756" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#e8622c" stroke-width="2"/><text x="839.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ransomware claim</text><text x="839.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">Chase confirms a data</text><text x="839.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">theft at its vendors;</text><text x="839.0" y="603" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">denies a link to the outage</text><line x1="839" y1="520" x2="700" y2="436" stroke="#e8622c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/><rect x="935" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="1018.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Apple</text><text x="1018.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">internal update,</text><text x="1018.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">says Apple;</text><text x="1018.0" y="603" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">not on the panel</text><rect x="1114" y="520" width="166" height="104" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="1197.0" y="546" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Optimizely</text><text x="1197.0" y="565" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">a confirmed attack</text><text x="1197.0" y="584" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">on 178 websites,</text><text x="1197.0" y="603" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">news sites among them</text><rect x="40" y="684" width="1240" height="92" rx="10" fill="#fcebe3" stroke="#e8622c" stroke-width="2" stroke-dasharray="7 5"/><text x="660" y="714" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Not in version 1: the news layer</text><text x="660" y="738" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="middle">Are the reports themselves the event? A wave of coverage, organic or pushed, with phantom outages in it.</text><text x="660" y="758" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="middle">Agreed for version 2, with knock-ons, denied reports and a campaign window that opens on 1 October.</text><rect x="40" y="812" width="400" height="100" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="240.0" y="838" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">At least one of the five was an attack</text><text x="240.0" y="857" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">calm 2.8%  ·  suspicious 25%</text><text x="240.0" y="898" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">middle 8.5%</text><rect x="460" y="812" width="400" height="100" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="660.0" y="838" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">This many after a big one, nothing unusual</text><text x="660.0" y="857" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">3 outages in the 7.0 days since the ground stop</text><text x="660.0" y="898" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">40%</text><rect x="880" y="812" width="400" height="100" rx="10" fill="#fff" stroke="#c9c8bf" stroke-width="2"/><text x="1080.0" y="838" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Would have been national news in a quiet week</text><text x="1080.0" y="857" font-size="13" font-weight="400" fill="#5f5e5a" text-anchor="middle">by the model&#x27;s tier figures</text><text x="1080.0" y="898" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">3.1 of 5</text><line x1="40" y1="934" x2="1280" y2="934" stroke="#e4e3dc" stroke-width="1.5"/><line x1="40" y1="960" x2="90" y2="960" stroke="#5f5e5a" stroke-width="2"/><text x="102" y="965" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="start">led to: a knock-on</text><line x1="330" y1="960" x2="380" y2="960" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="2 5"/><text x="392" y="965" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="start">asked or reported, not established</text><line x1="690" y1="960" x2="740" y2="960" stroke="#e8622c" stroke-width="2.5" stroke-dasharray="7 5"/><text x="752" y="965" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="start">open: a claim or a denied link</text><rect x="990" y="951" width="46" height="18" rx="5" fill="#fff" stroke="#c9c8bf" stroke-width="2" stroke-dasharray="6 5"/><text x="1048" y="965" font-size="14" font-weight="400" fill="#5f5e5a" text-anchor="start">context, not scored</text><text x="40" y="1005" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="start">Model v1 frozen 18 Nov 2026, 10:00 UTC. Rows known before the freeze are scored in hindsight. Log row 114.</text></svg>